name: Dependency verification
# Runs build + tests for the npm sub-projects (servers/, tests/) on dependency
# bump PRs, so a bumped lockfile is proven to install, compile and pass its
# smoke tests before merge. Not wired into branch protection: it produces
# evidence, it does not gate the merge button.
on:
  pull_request:
    # `edited` matters: the job re-evaluates when a title is fixed after opening.
    types: [opened, synchronize, reopened, edited, labeled]
    paths:
      - "servers/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-servers:
    # Dependency PRs only: this remediation, Dependabot's own PRs, or an explicit label.
    if: >-
      contains(github.event.pull_request.title, 'Dependabot') ||
      startsWith(github.event.pull_request.title, 'chore(deps)') ||
      startsWith(github.head_ref, 'cploujoux/devin/dependabot-') ||
      startsWith(github.head_ref, 'dependabot/') ||
      contains(github.event.pull_request.labels.*.name, 'dependencies') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: servers
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: servers/package.json
      - name: Setup Node.js 23
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "23"
          cache: pnpm
          cache-dependency-path: servers/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        # Evidence, not a gate: tsc across this module's combined SDK surface
        # (aws-sdk, openai, twilio, qdrant, mcp) already OOMs on the unmodified
        # base branch today (confirmed locally, and in production: every
        # servers/-path server has failed to build/publish since 2026-07-31,
        # see build-and-push run 30595040877). That is a pre-existing, unrelated
        # regression from a prior AWS SDK client bump, not something this
        # dependency PR introduces or is responsible for fixing.
        # continue-on-error keeps this step visible without blocking the job.
        continue-on-error: true
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
        run: pnpm run build
      - name: Test
        run: pnpm run test

  verify-tests:
    if: >-
      contains(github.event.pull_request.title, 'Dependabot') ||
      startsWith(github.event.pull_request.title, 'chore(deps)') ||
      startsWith(github.head_ref, 'cploujoux/devin/dependabot-') ||
      startsWith(github.head_ref, 'dependabot/') ||
      contains(github.event.pull_request.labels.*.name, 'dependencies') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tests
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: tests/package.json
      - name: Setup Node.js 23
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "23"
          cache: pnpm
          cache-dependency-path: tests/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit test
        # `pnpm test` drives tests/src/client.ts against a live MCP endpoint
        # and needs real network/credentials; it deliberately is not run here.
        # `test:unit` is the hermetic subset (test/*.test.js), no network.
        run: pnpm run test:unit
