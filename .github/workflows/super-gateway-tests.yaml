name: Super gateway tests

on:
  pull_request:
    paths:
      - "super-gateway/**"
      - ".github/workflows/super-gateway-tests.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: super-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.3"
          cache-dependency-path: super-gateway/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
