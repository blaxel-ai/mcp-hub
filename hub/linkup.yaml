repository: https://github.com/LinkupPlatform/linkup-mcp-server
dockerfile: "@mcp-hub"
transport: http-stream
displayName: Linkup
branch: main
url: https://app.linkup.so/api-keys
icon: https://avatars.githubusercontent.com/u/175112039?s=200&v=4
description: Plug your LLM to the Internet.
longDescription: |
  Plug your LLM to the Internet.
secrets:
  - linkupApiKey
categories:
  - internet
  - search
smithery:
  startCommand:
    type: stdio
    configSchema:
      # JSON Schema defining the configuration options for the MCP.
      type: object
      required:
        - linkupApiKey
      properties:
        linkupApiKey:
          type: string
          description: Your Linkup API Key
    commandFunction:
      # Upstream's original Python server (LinkupPlatform/python-mcp-server,
      # the `mcp-search-linkup` PyPI package) was archived 2025-10-27 in
      # favor of a TypeScript rewrite: LinkupPlatform/linkup-mcp-server,
      # published to npm as `linkup-mcp-server`. Its published bin runs
      # dist/stdio.js directly (stdio mode) and reads the same
      # LINKUP_API_KEY env var the old server did. See
      # dockerfiles/linkup.Dockerfile.
      |-
      config => ({
        command: 'linkup-mcp-server',
        args: [],
        env: {
          LINKUP_API_KEY: config.linkupApiKey
        }
      })
